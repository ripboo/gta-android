name: Extract with pyidbutil

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Clone pyidbutil / idbutil repository
      run: |
        git clone https://github.com/nlitsme/pyidbutil.git || git clone https://github.com/nlitsme/idbutil.git

    - name: Run idbtool to extract names and filter for Renderer::ScanWorld
      run: |
        # البحث في محتوى المجلد عما إذا كانت الأداة تحتوي على سكربت idbtool أو idbutil التشغيلي
        python3 -c '
        import os, subprocess
        
        # مسار ملف الـ i64 لديك
        db_file = "idb/arm64-v8a/libGTASA.so.i64"
        target = "Renderer::ScanWorld"
        
        output_file = "scanworld_result.txt"
        
        # استخدام idbtool إذا كان متاحاً أو كتابة استدعاء للأداة
        print(f"Checking database: {db_file}")
        
        # محاولة البحث عن الدوال والأسماء عبر الأداة
        found_lines = []
        
        # سنقوم بتشغيل أمر idbtool لاستخراج كافة الأسماء (نحتاج لتحديد مسار الأداة بناء على المستودع)
        tool_cmd = ["python3", "pyidbutil/idbtool.py", "-n", db_file] if os.path.exists("pyidbutil/idbtool.py") else ["idbtool", "-n", db_file]
        
        try:
            result = subprocess.run(tool_cmd, capture_output=True, text=True, check=True)
            for line in result.stdout.splitlines():
                if target in line:
                    found_lines.append(line)
        except Exception as e:
            print(f"Execution notice: {e}")
            
        with open(output_file, "w", encoding="utf-8") as f:
            f.write(f"--- Results for {target} using nlitsme tool ---\n")
            if found_lines:
                for l in found_lines:
                    f.write(l + "\n")
            else:
                f.write(f"Function {target} not found or tool path needs adjustment.\n")
        '

    - name: Commit and Push Result
      run: |
        if [ -f "scanworld_result.txt" ]; then
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scanworld_result.txt
          git diff --staged --quiet || git commit -m "Extract Renderer::ScanWorld using nlitsme tool"
          git push
        fi
