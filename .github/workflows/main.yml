name: Extract and Commit Renderer::ScanWorld

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-idb

    - name: Run Extraction Script
      run: |
        python -c '
        import idb
        file_path = "idb/arm64-v8a/libGTASA.so.i64"
        target_name = "Renderer::ScanWorld"
        
        try:
            with idb.from_file(file_path) as db:
                found = False
                with open("scanworld_result.txt", "w", encoding="utf-8") as out:
                    out.write(f"--- Extraction results for {target_name} ---\n")
                    for ea, name in db.names.items():
                        if target_name in name:
                            out.write(f"Found Function: {name} at Address: {hex(ea)}\n")
                            found = True
                    if not found:
                        out.write(f"Function {target_name} not found in database names.\n")
            print("Extraction script executed successfully.")
        except Exception as e:
            print(f"Error occurred: {e}")
            # إنشاء ملف فارغ أو ملف يحمل الخطأ حتى لا يفشل الـ Git تماماً إذا أردت
            with open("scanworld_result.txt", "w", encoding="utf-8") as out:
                out.write(f"Extraction failed with error: {e}\n")
        '

    - name: Commit and Push to Main Repository
      run: |
        # التأكد من أن الملف موجود بالفعل قبل تنفيد أوامر git
        if [ -f "scanworld_result.txt" ]; then
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scanworld_result.txt
          git status
          git diff --staged --quiet || git commit -m "Auto-extract Renderer::ScanWorld result"
          git push
        else
          echo "Error: scanworld_result.txt was not created."
          exit 1
        fi
