name: Extract ScanWorld with python-idb

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install python-idb and Capstone
      run: |
        python -m pip install --upgrade pip
        pip install python-idb capstone

    - name: Run Extraction Script
      run: |
        python3 -c '
        import idb

        file_path = "idb/arm64-v8a/libGTASA.so.i64"
        output_file = "scanworld_result.txt"
        target_name = "ScanWorld"

        print(f"Opening database with python-idb: {file_path}")

        with open(output_file, "w", encoding="utf-8") as out:
            out.write(f"--- Search Results for {target_name} ---\n")
            try:
                with idb.from_file(file_path) as db:
                    api = idb.IDAPython(db)
                    found = False
                    
                    # المرور على كافة الدوال عبر محاكاة idautils
                    for ea in api.idautils.Functions():
                        try:
                            # محاولة جلب اسم الدالة بطريقتين لدعم اختلاف إصدارات الـ API
                            name = api.idc.GetFunctionName(ea)
                        except Exception:
                            try:
                                name = api.idc.get_func_name(ea)
                            except Exception:
                                name = ""
                        
                        if target_name in name or "Renderer" in name:
                            out.write(f"Address: {hex(ea)} - Name: {name}\n")
                            found = True
                            
                    if not found:
                        out.write(f"Function containing {target_name} not found in functions list.\n")
                print("Extraction completed successfully.")
            except Exception as e:
                out.write(f"Error: {e}\n")
                print(f"Extraction failed: {e}")
        '

    - name: Commit and Push Result
      run: |
        if [ -f "scanworld_result.txt" ]; then
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scanworld_result.txt
          git diff --staged --quiet || git commit -m "Extract ScanWorld using python-idb library"
          git push
        fi
