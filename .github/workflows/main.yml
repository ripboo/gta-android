name: Extract First 600 Lines with pyidbutil

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Clone pyidbutil repository
      run: |
        git clone https://github.com/nlitsme/pyidbutil.git

    - name: Run idbtool and get first 600 lines
      run: |
        python3 -c '
        import os, subprocess
        
        db_file = "idb/arm64-v8a/libGTASA.so.i64"
        output_file = "scanworld_result.txt"
        
        # تحديد المسار الصحيح لأداة idbtool.py داخل المستودع المستسخح
        tool_cmd = ["python3", "pyidbutil/idbtool.py", "-n", db_file]
        
        print(f"Executing: {tool_cmd}")
        sample_lines = []
        
        try:
            result = subprocess.run(tool_cmd, capture_output=True, text=True, check=True)
            lines = result.stdout.splitlines()
            
            # اقتطاع أول 600 سطر فقط
            sample_lines = lines[:600]
            
        except Exception as e:
            print(f"Error running tool: {e}")
            
        with open(output_file, "w", encoding="utf-8") as f:
            f.write("=== FIRST 600 LINES FROM IDA DATABASE ===\n")
            if sample_lines:
                for l in sample_lines:
                    f.write(l + "\n")
            else:
                f.write("Could not retrieve lines or tool execution failed.\n")
        '

    - name: Commit and Push Result
      run: |
        if [ -f "scanworld_result.txt" ]; then
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scanworld_result.txt
          git diff --staged --quiet || git commit -m "Extract first 600 lines from i64 database"
          git push
        fi
