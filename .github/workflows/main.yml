name: Inspect SQLite i64 and Search ScanWorld

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Create Python Extraction Script
      run: |
        cat << 'EOF' > parse_i64.py
        import sqlite3
        import os

        db_file = "idb/arm64-v8a/libGTASA.so.i64"
        output_file = "scanworld_result.txt"

        print(f"Opening database: {db_file}")

        with open(output_file, "w", encoding="utf-8") as f:
            try:
                conn = sqlite3.connect(db_file)
                cursor = conn.cursor()
                
                # استعراض كافة الجداول
                cursor.execute("SELECT name FROM sqlite_master WHERE type='table';")
                tables = cursor.fetchall()
                
                f.write("=== TABLES FOUND IN .i64 DATABASE ===\n")
                for table in tables:
                    f.write(f"- {table[0]}\n")
                f.write("\n")
                
                # البحث عن كلمة ScanWorld أو Renderer داخل البيانات
                f.write("=== SEARCH RESULTS FOR ScanWorld / Renderer ===\n")
                found = False
                
                for table in tables:
                    t_name = table[0]
                    try:
                        cursor.execute(f"SELECT * FROM [{t_name}]")
                        rows = cursor.fetchall()
                        for row in rows:
                            row_str = str(row)
                            if "ScanWorld" in row_str or "Renderer" in row_str:
                                f.write(f"[Table: {t_name}] -> {row_str[:300]}...\n")
                                found = True
                    except Exception:
                        continue
                        
                if not found:
                    f.write("No plain text match for ScanWorld or Renderer found in table rows.\n")
                    
                conn.close()
                print("Inspection completed successfully.")
                
            except Exception as e:
                f.write(f"Error opening as SQLite database: {e}\n")
        EOF

    - name: Run Extraction Script
      run: python3 parse_i64.py

    - name: Commit and Push Result
      run: |
        if [ -f "scanworld_result.txt" ]; then
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scanworld_result.txt
          git diff --staged --quiet || git commit -m "Inspect i64 database via SQLite and search ScanWorld"
          git push
        fi
